<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/fich06.css">
    <title>FlexBox</title>
</head>
<body>
    <div class="flex-container">
        <div class="flex-item verde"></div>
        <div class="flex-item amarelo"></div>
        <div class="flex-item vermelho"></div>
        <div class="flex-item">
             <img width="50" height="50" src="https://getbootstrap.com/docs/4.0/assets/brand/bootstrap-solid.svg" alt="Imagem 1">
        </div>
        <div class="flex-item">
            <h2>Please sign in</h2>
        </div>
        <div class="flex-item ">
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password">
        </div>
        <div class="flex-item ">
            <input type="checkbox">remember me</input>
        </div>
        <div class="flex-item ">
            <button class="blue" type="submit">Sign in</button>
        </div>
        <div class="flex-item ">
            <p>2026-2027</p>
        </div>
        
    </div>

</html>
